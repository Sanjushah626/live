<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments :: adminLayout(${pageTitle}, ${currentPage}, ${adminUsername}, ~{::section#adminPageBody})}">
<body>
<section id="adminPageBody">
  <div class="page-header">
    <div><h1>News Management</h1><p>Create, update, and remove market announcements.</p></div>
    <div class="action-buttons">
      <div class="search-box" style="width:240px;"><i class="fa-solid fa-magnifying-glass"></i><input type="text" class="search-input" data-search-target="newsTable" placeholder="Search news..."></div>
      <a href="/add_news.php" class="btn btn-primary">+ Add News</a>
    </div>
  </div>
  <div th:if="${status == 'updated'}" class="alert alert-success auto-dismiss">News article updated successfully.</div>
  <div th:if="${status == 'deleted'}" class="alert alert-success auto-dismiss">News article deleted successfully.</div>
  <div class="card">
    <div class="card-header"><h2 th:text="'Published Articles (' + ${#lists.size(newsList)} + ')'">Articles</h2></div>
    <div class="table-responsive">
      <table class="data-table" id="newsTable">
        <thead><tr><th>Image</th><th>Title</th><th>Description</th><th>Published</th><th>Actions</th></tr></thead>
        <tbody>
          <tr th:each="n : ${newsList}">
            <td><img th:if="${n.image != null and !n.image.isEmpty()}" th:src="@{'/uploads/news/' + ${n.image}}" alt="Thumb" class="news-thumb"><span th:if="${n.image == null or n.image.isEmpty()}" class="badge badge-muted">None</span></td>
            <td style="font-weight:700;" th:text="${n.title}">Title</td>
            <td th:text="${@fmt.truncate(n.description, 110)}">Desc</td>
            <td th:text="${@fmt.shortDate(n.createdAt)}">-</td>
            <td><div class="action-buttons"><a th:href="@{/edit_news.php(id=${n.id})}" class="btn btn-outline btn-sm">Edit</a><a th:href="@{/delete_news.php(id=${n.id})}" class="btn btn-danger btn-sm js-delete-btn" th:attr="data-message='Delete article ' + ${n.title} + '?'">Delete</a></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
