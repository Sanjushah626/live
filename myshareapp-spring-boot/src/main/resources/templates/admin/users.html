<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments :: adminLayout(${pageTitle}, ${currentPage}, ${adminUsername}, ~{::section#adminPageBody})}">
<body>
<section id="adminPageBody">
  <div class="page-header">
    <div><h1>Users Management</h1><p>View registered accounts, portfolio counts, and manage user access.</p></div>
    <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" class="search-input" data-search-target="usersTable" placeholder="Search by name, email, or role..."></div>
  </div>
  <div th:if="${deleteMessage != null and !deleteMessage.isEmpty()}" class="alert auto-dismiss" th:classappend="${deleteMessageType == 'danger'} ? 'alert-danger' : 'alert-success'" th:text="${deleteMessage}">Status</div>
  <div class="card">
    <div class="card-header"><h2 th:text="'All Users (' + ${#lists.size(users)} + ')'">All Users</h2></div>
    <div class="table-responsive">
      <table class="data-table" id="usersTable">
        <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Portfolios</th><th>Joined</th><th>Action</th></tr></thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td><div class="table-avatar"><span class="avatar-circle" th:text="${@fmt.initial(u['username'])}">U</span><span style="font-weight:600;" th:text="${u['username']}">user</span></div></td>
            <td th:text="${u['email']}">email</td>
            <td><span class="badge" th:classappend="${u['role'] == 'admin'} ? 'badge-admin' : 'badge-user'" th:text="${u['role']}">user</span></td>
            <td><strong th:text="${u['portfolioCount']}">0</strong></td>
            <td th:text="${@fmt.shortDate(u['createdAt'])}">-</td>
            <td>
              <span th:if="${u['id'] == adminUserId}" class="badge badge-muted">Current Admin</span>
              <a th:unless="${u['id'] == adminUserId}" th:href="@{/users.php(delete=${u['id']})}" class="btn btn-danger btn-sm js-delete-btn" th:attr="data-message='Delete user ' + ${u['username']} + '?'">Delete</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
