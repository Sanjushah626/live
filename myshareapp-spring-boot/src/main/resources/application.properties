spring.application.name=myshareapp
server.address=0.0.0.0
server.port=${PORT:8090}

# MySQL Database Configuration (override via env vars or use -Dspring-boot.run.profiles=h2)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:myshareapp}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Multipart Upload Settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.news-dir=${UPLOAD_NEWS_DIR:uploads/news}

# YONEPSE API Base URL (https://shubhamnpk.github.io/yonepse/pages/docs.html)
yonepse.api.base-url=${YONEPSE_BASE_URL:https://raw.githubusercontent.com/Shubhamnpk/yonepse/main/data}
